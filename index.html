<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Sorting Playground | Code & Visualize</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7237384529818812"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header & Controls -->
        <header class="toolbar">
            <div class="brand">
                <h1>JS <span class="highlight">Playground</span></h1>
                <div class="module-tabs">
                    <button class="tab-btn active" data-module="sorting">Sorting</button>
                    <button class="tab-btn" data-module="pathfinding">Pathfinding</button>
                </div>
            </div>

            <div class="controls">
                <!-- Sorting Controls -->
                <div id="controls_sorting" class="module-controls">
                    <div class="control-group mode-toggle">
                        <label>Mode:</label>
                        <div class="toggle-switch">
                            <input type="radio" id="modeCode" name="appMode" value="code" checked>
                            <label for="modeCode">Code</label>
                            <input type="radio" id="modeGame" name="appMode" value="game">
                            <label for="modeGame">Game</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Algo:</label>
                        <select id="algoSelect">
                            <optgroup label="Simple (O(n²))">
                                <option value="bubble">Bubble Sort</option>
                                <option value="selection">Selection Sort</option>
                                <option value="insertion">Insertion Sort</option>
                                <option value="cocktail">Cocktail Shaker Sort</option>
                            </optgroup>
                            <optgroup label="Efficient (O(n log n))">
                                <option value="quick">Quick Sort</option>
                                <option value="merge">Merge Sort</option>
                                <option value="heap">Heap Sort</option>
                            </optgroup>
                            <optgroup label="Special / Fun">
                                <option value="radix">Radix Sort (LSD)</option>
                                <option value="bogo">Bogo Sort (The Worst)</option>
                            </optgroup>
                            <optgroup label="User Defined">
                                <option value="custom">Custom Script</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="control-group">
                        <button id="btnGenerate" class="btn secondary">Shuffle</button>
                        <button id="btnRun" class="btn primary">Run</button>
                        <button id="btnStop" class="btn danger" disabled>Stop</button>
                    </div>

                    <div class="control-group">
                        <label>Size:</label>
                        <input type="range" id="sizeRange" min="5" max="50" value="20">
                    </div>

                    <div class="control-group">
                        <label>Speed:</label>
                        <input type="range" id="speedRange" min="1" max="100" value="50">
                    </div>
                </div>

                <!-- Pathfinding Controls (Hidden by default) -->
                <div id="controls_pathfinding" class="module-controls hidden">
                    <div class="control-group mode-toggle">
                        <label>Mode:</label>
                        <div class="toggle-switch">
                            <input type="radio" id="pfModeCode" name="pfAppMode" value="code" checked>
                            <label for="pfModeCode">Code</label>
                            <input type="radio" id="pfModeGame" name="pfAppMode" value="game">
                            <label for="pfModeGame">Game</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Algo:</label>
                        <select id="pfAlgoSelect">
                            <option value="bfs">BFS</option>
                            <option value="dfs">DFS</option>
                            <option value="astar">A* Search</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <button id="btnPfReset" class="btn secondary">Reset</button>
                        <button id="btnPfRun" class="btn primary">Run</button>
                        <!-- Stop shared? Or separate? Let's assume shared execution engine for now or add new btn -->
                        <button id="btnPfStop" class="btn danger" disabled>Stop</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Code Editor Pane -->
            <section class="pane editor-pane">
                <div class="pane-header">
                    <span id="editorTitle">JavaScript Editor</span>
                    <small id="editorSub">Available: <code>data[]</code>, <code>await swap(i,j)</code></small>
                </div>
                <!-- Simple Textarea for now, can upgrade to CodeMirror later if needed -->
                <textarea id="codeEditor" spellcheck="false"></textarea>

                <!-- Game Overlay (Hidden by default) -->
                <div id="gameOverlay" class="game-overlay hidden">
                    <div class="game-content">
                        <h2>Interactive Sort</h2>
                        <p id="gameInstruction">Select an algorithm and click Run to start!</p>

                        <div id="gameControls" class="game-controls hidden">
                            <div class="current-step">
                                <span id="stepDesc">Compare A and B</span>
                            </div>
                            <div class="action-buttons">
                                <button id="btnAction1" class="btn game-btn">Action 1</button>
                                <button id="btnAction2" class="btn game-btn secondary">Action 2</button>
                            </div>
                            <div id="feedbackMsg" class="feedback"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Visualizer Pane -->
            <section class="pane viz-pane">
                <div class="pane-header">
                    <span id="vizTitle">Visualizer</span>
                    <span id="statusText">Ready</span>
                </div>

                <!-- Sorting Visualizer -->
                <div id="visualizerContainer">
                    <!-- Bars will be injected here by JS -->
                </div>

                <!-- Pathfinding Grid (Hidden by default) -->
                <div id="gridContainer" class="hidden">
                    <!-- Grid cells injected here -->
                </div>
            </section>
        </main>

        <!-- Footer / Ad Space -->
        <footer class="ad-footer">
            <div class="ad-container">
                <!-- Ad Unit -->
                <!-- Ad Unit: Fixed size to prevent layout shifts -->
                <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px"
                    data-ad-client="ca-pub-7237384529818812" data-ad-slot="3580735781"></ins>
            </div>
        </footer>
    </div>

    <!-- AdSense Initialization Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch (e) {
                        console.warn("AdSense init warn:", e);
                    }
                }
            }, 1000);
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
