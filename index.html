<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Void | Explore Your Universe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7237384529818812"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Immersive Canvas Background -->
    <canvas id="cosmosCanvas"></canvas>

    <!-- UI Overlay (Heads-Up Display) -->
    <div id="uiLayer">
        <!-- Top: Resources & Status -->
        <header class="hud-top">
            <div class="resource-panel">
                <div class="energy-display">
                    <span class="label">ENERGY</span>
                    <span id="energyVal" class="value glow-text">0</span>
                </div>
                <div class="level-display">
                    <span class="label">STAR CLASS</span>
                    <span id="starClass" class="value">Proto-Star</span>
                    <div class="progress-bar">
                        <div id="levelProgress" class="fill"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Center: Interaction Zone (Invisible, handles clicks on star) -->
        <div id="clickZone"></div>

        <!-- Notification / Content Modal Area -->
        <div id="overlayContainer" class="hidden">
            <div class="content-card glass-panel">
                <button id="closeContentBtn" class="close-btn">×</button>
                <div id="contentBody">
                    <h3 id="contentTitle">Cosmic Data</h3>
                    <p id="contentText">Analyzing signal...</p>
                    <button id="claimRewardBtn" class="action-btn">Absorb Energy (+<span
                            id="rewardVal">500</span>)</button>
                </div>
            </div>
        </div>

        <!-- Bottom: Control Systems -->
        <footer class="hud-bottom">
            <!-- AdSense Slot (Restored) -->
            <div class="ad-container glass-panel" style="margin-bottom: 10px; padding: 5px;">
                <ins class="adsbygoogle" style="display:block; width: 320px; height: 50px;"
                    data-ad-client="ca-pub-7237384529818812" data-ad-slot="3580735781" data-ad-format="auto"
                    data-full-width-responsive="true"></ins>
            </div>

            <div class="control-deck glass-panel">
                <button class="deck-btn active" onclick="switchPanel('upgrades')">⚡ Upgrades</button>
                <button class="deck-btn" onclick="switchPanel('stats')">📊 Cosmic Data</button>
                <button class="deck-btn" onclick="switchPanel('birth')">🌟 Birth Origin</button>
            </div>

            <!-- Panels (Slide up) -->
            <div id="panelContainer" class="panel-slider hidden">
                <!-- Upgrade Panel -->
                <div id="upgradesPanel" class="sub-panel">
                    <h3>Stellar Evolution</h3>
                    <div class="upgrade-list" id="upgradeList">
                        <!-- Dynamic Upgrades -->
                    </div>
                </div>

                <!-- Stats Panel (Trivia/History/Etc) -->
                <div id="statsPanel" class="sub-panel hidden">
                    <h3>Universe Knowledge</h3>
                    <div class="stats-grid">
                        <div class="stat-item" onclick="fetchContent('trivia')">
                            <span class="icon">❓</span>
                            <span>Gather Trivia Shard</span>
                        </div>
                        <div class="stat-item" onclick="fetchContent('fact')">
                            <span class="icon">💡</span>
                            <span>Scan Useless Fact</span>
                        </div>
                        <div class="stat-item" onclick="fetchContent('history')">
                            <span class="icon">📜</span>
                            <span>Access History Log</span>
                        </div>
                    </div>
                </div>

                <!-- Birth Origin Panel -->
                <div id="birthPanel" class="sub-panel hidden">
                    <h3>Origin Signal</h3>
                    <div class="input-group">
                        <input type="date" id="birthDate" class="lcd-input">
                        <button onclick="discoverOrigin()" class="lcd-btn">Triangulate</button>
                    </div>
                    <div id="originResult" class="origin-display"></div>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
