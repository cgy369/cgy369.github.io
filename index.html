<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Sorting Playground | Code & Visualize</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7237384529818812"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="toolbar">
            <div class="brand">
                <h1>JS <span class="highlight">Play</span></h1>

                <!-- MODULE SELECTOR (Replaces Sidebar) -->
                <select id="moduleSelect" class="module-select">
                    <option value="sorting" data-i18n="tab_sorting">Sorting</option>
                    <option value="maze" data-i18n="tab_maze">Maze Gen</option>
                    <option value="pathfinding" data-i18n="tab_pathfinding">Pathfinding</option>
                    <option value="gameoflife" data-i18n="tab_gameoflife">Game of Life</option>
                    <option value="tsp" data-i18n="tab_tsp">TSP</option>
                    <option value="pixel" data-i18n="tab_pixel">Pixel Master</option>
                </select>

                <select id="langSelect" style="margin-left: 10px; padding: 4px; border-radius: 4px;">
                    <option value="en">🇺🇸 EN</option>
                    <option value="ko" selected>🇰🇷 KO</option>
                </select>
            </div>

            <div class="controls">
                <!-- Sorting Controls -->
                <div id="controls_sorting" class="module-controls">
                    <div class="control-group mode-toggle">
                        <label data-i18n="label_mode">Mode:</label>
                        <div class="toggle-switch">
                            <input type="radio" id="modeCode" name="appMode" value="code" checked>
                            <label for="modeCode" data-i18n="mode_code">Code</label>
                            <input type="radio" id="modeGame" name="appMode" value="game">
                            <label for="modeGame" data-i18n="mode_game">Game</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <select id="algoSelect">
                            <optgroup label="Simple (O(n²))" data-i18n-label="opt_simple">
                                <option value="bubble" data-i18n="algo_bubble">Bubble Sort</option>
                                <option value="selection" data-i18n="algo_selection">Selection Sort</option>
                                <option value="insertion" data-i18n="algo_insertion">Insertion Sort</option>
                                <option value="cocktail" data-i18n="algo_cocktail">Cocktail Shaker Sort</option>
                            </optgroup>
                            <optgroup label="Efficient (O(n log n))" data-i18n-label="opt_efficient">
                                <option value="quick" data-i18n="algo_quick">Quick Sort</option>
                                <option value="merge" data-i18n="algo_merge">Merge Sort</option>
                                <option value="heap" data-i18n="algo_heap">Heap Sort</option>
                            </optgroup>
                            <optgroup label="Special / Fun" data-i18n-label="opt_curious">
                                <option value="radix" data-i18n="algo_radix">Radix Sort (LSD)</option>
                                <option value="bogo" data-i18n="algo_bogo">Bogo Sort</option>
                            </optgroup>
                            <optgroup label="User Defined" data-i18n-label="opt_custom">
                                <option value="custom" data-i18n="algo_custom">Custom Script</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="control-group">
                        <button id="btnGenerate" class="btn secondary" data-i18n="btn_shuffle">Shuffle</button>
                        <button id="btnRun" class="btn primary" data-i18n="btn_run">Run</button>
                        <!-- Stop Button: Shared ID, specific logic -->
                        <button id="btnStop" class="btn danger" disabled data-i18n="btn_stop">Stop</button>
                    </div>

                    <div class="control-group">
                        <label data-i18n="label_size">Size</label>
                        <input type="range" id="sizeRange" min="5" max="200" value="50" style="width: 80px">
                    </div>
                    <div class="control-group">
                        <label data-i18n="label_speed">Speed</label>
                        <input type="range" id="speedRange" min="1" max="100" value="50" style="width: 80px">
                    </div>

                    <div class="control-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="imgModeCheck"> <span data-i18n="label_img_mode">Image</span>
                        </label>
                        <input type="file" id="imgUpload" accept="image/*" class="hidden"
                            style="width: 0; height: 0; opacity: 0; overflow: hidden; position: absolute; z-index: -1;">
                        <label for="imgUpload" class="btn secondary sm" id="lblImgUpload"
                            style="display:none; margin-left:5px;">📂</label>
                    </div>
                </div>

                <!-- Pathfinding Controls -->
                <div id="controls_pathfinding" class="module-controls hidden">
                    <select id="pfAlgoSelect">
                        <option value="bfs">BFS</option>
                        <option value="dfs">DFS</option>
                        <option value="astar">A* Search</option>
                    </select>
                    <button id="btnPfReset" class="btn secondary" data-i18n="btn_reset">Reset</button>
                    <button id="btnPfRun" class="btn primary" data-i18n="btn_run">Run</button>
                    <!-- Shared Stop Button Used -->
                </div>

                <!-- Maze Controls -->
                <div id="controls_maze" class="module-controls hidden">
                    <button id="btnMazeGen" class="btn primary" data-i18n="btn_maze_gen">Generate Maze
                        (Recursive)</button>
                    <span class="instruction-text" data-i18n="maze_instruction">미로 생성 후 길찾기에서 길을 찾아볼 수 있습니다.</span>
                    <!-- Stop Button Shared -->
                </div>

                <!-- N-Queens Controls -->

                <!-- Game of Life Controls -->
                <div id="controls_gameoflife" class="module-controls hidden">
                    <button id="btnGolStart" class="btn primary">Start</button>
                    <button id="btnGolStop" class="btn danger">Stop</button>
                    <button id="btnGolClear" class="btn secondary">Clear</button>
                    <button id="btnGolRandom" class="btn secondary">Random</button>
                </div>

                <!-- TSP Controls -->
                <div id="controls_tsp" class="module-controls hidden">
                    <button id="btnTspRun" class="btn primary">Solve (Nearest)</button>
                    <button id="btnTspNew" class="btn secondary">New Cities</button>
                </div>

                <!-- Pixel Master Controls -->
                <div id="controls_pixel" class="module-controls hidden">
                    <select id="pixelTool" class="btn tertiary" style="padding: 4px;">
                        <option value="mask">Mask (Global)</option>
                        <option value="smudge">Smudge (Drag)</option>
                        <option value="sand">Sand (Scatter)</option>
                    </select>
                    <input type="color" id="pixelColor" value="#f43f5e" style="height: 38px; cursor: pointer;">

                    <label style="color: white; font-size: 12px; margin-left: 10px;">Size:</label>
                    <input type="range" id="pixelBrushSize" min="5" max="100" value="30" style="width: 80px;">

                    <label for="pixelUpload" id="lblPixelUpload" class="btn secondary">Upload</label>
                    <input type="file" id="pixelUpload" class="hidden" accept="image/*">
                    <button id="btnPixelHeal" class="btn primary">Heal ✨</button>
                    <button id="btnPixelReset" class="btn tertiary">Reset</button>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Code Editor Pane -->
            <section class="pane editor-pane">
                <div class="pane-header">
                    <span id="editorTitle">JavaScript Editor</span>
                    <button id="btnEditorToggle" class="mobile-toggle">Toggle Editor</button>
                    <small id="editorSub">Available: <code>data[]</code>, <code>await swap(i,j)</code></small>
                </div>
                <textarea id="codeEditor" spellcheck="false"></textarea>

                <!-- Game Overlay -->
                <div id="gameOverlay" class="game-overlay hidden">
                    <div class="game-content">
                        <h2 data-i18n="game_title">Interactive Sort</h2>
                        <p id="gameInstruction" data-i18n="game_instruction">Select an algorithm and click Run to start!
                        </p>

                        <div id="gameControls" class="game-controls hidden">
                            <div class="current-step">
                                <span id="stepDesc">Compare A and B</span>
                            </div>
                            <div class="action-buttons">
                                <button id="btnAction1" class="btn game-btn" data-i18n="game_swap">Swap</button>
                                <button id="btnAction2" class="btn game-btn secondary"
                                    data-i18n="game_pass">Pass</button>
                            </div>
                            <div id="feedbackMsg" class="feedback"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Visualizer Pane -->
            <section class="pane viz-pane">
                <div class="pane-header">
                    <span id="vizTitle" data-i18n="pane_visualizer">Visualizer</span>
                    <span id="statusText">Ready</span>
                </div>

                <!-- Sorting Visualizer -->
                <div id="visualizerContainer"></div>

                <!-- Grid Container (Pathfinding, Maze, GameOfLife, N-Queens) -->
                <div id="gridContainer" class="hidden"></div>

                <!-- TSP Canvas -->
                <canvas id="tspCanvas" class="hidden"></canvas>

                <!-- Pixel Canvas -->
                <canvas id="pixelCanvas" class="hidden"></canvas>
            </section>
        </main>

        <!-- Footer / Ad Space -->
        <footer class="ad-footer">
            <div class="ad-container">
                <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px"
                    data-ad-client="ca-pub-7237384529818812" data-ad-slot="3580735781"></ins>
            </div>
        </footer>
    </div>

    <!-- AdSense Initialization Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof adsbygoogle !== 'undefined') {
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch (e) {
                        console.warn("AdSense init warn:", e);
                    }
                }
            }, 1000);
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
